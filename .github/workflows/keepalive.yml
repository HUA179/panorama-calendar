name: keepalive

# 公开仓库连续 60 天无活动，GitHub 会自动停用 schedule 工作流。
# 每月一次空提交即可保活；GITHUB_TOKEN 的 push 不会触发其他工作流，不会造成循环。

on:
  schedule:
    - cron: "7 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 空提交保活
        run: |
          git config user.name  "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
